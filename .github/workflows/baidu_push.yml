name: 百度链接提交

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"

jobs:
  baidu-push:
    runs-on: ubuntu-latest

    steps:
      - name: 提交网址到百度
        env:
          BAIDU_PUSH_URL: ${{ secrets.BAIDU_PUSH_URL }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: |
          echo "准备提交：$PAGE_URL"

          if [ -z "$BAIDU_PUSH_URL" ]; then
            echo "错误：没有配置 BAIDU_PUSH_URL"
            exit 1
          fi

          if [ -z "$PAGE_URL" ]; then
            echo "错误：没有配置 PAGE_URL"
            exit 1
          fi

          curl -sS \
            -H "Content-Type: text/plain" \
            --data-binary "$PAGE_URL" \
            "$BAIDU_PUSH_URL"
