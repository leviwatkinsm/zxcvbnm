<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    {{ page.title | default: "内容导航中心" }}
  </title>

  <meta name="description"
        content="{{ page.description | default: '文章分类、最新内容与资料导航。' }}">

  <link rel="stylesheet"
        href="{{ '/assets/style.css' | relative_url }}">
</head>

<body>

<header class="site-header">

  <div class="header-inner">

    <a href="/" class="logo">
      内容导航中心
    </a>

    <nav class="nav">
      <a href="/">首页</a>
      <a href="/articles/">全部文章</a>
    </nav>

  </div>

</header>


<section class="hero">

  <div class="hero-inner">

    <span class="hero-tag">
      CONTENT CENTER
    </span>

    <h1>
      文章与资料导航中心
    </h1>

    <p class="hero-desc">
      汇总最新发布内容、专题文章与资料索引，
      通过分类快速查找需要的内容。
    </p>

    <div class="hero-actions">

      <a href="/articles/"
         class="btn-primary">
        浏览全部文章
      </a>

      <a href="#latest"
         class="btn-secondary">
        最新发布
      </a>

    </div>

  </div>

</section>


<section class="stats">

  <div class="stat">
    <span class="stat-number">103</span>
    <span class="stat-label">已收录文章</span>
  </div>

  <div class="stat">
    <span class="stat-number">1</span>
    <span class="stat-label">内容分类</span>
  </div>

  <div class="stat">
    <span class="stat-number">持续更新</span>
    <span class="stat-label">内容状态</span>
  </div>

</section>


<main class="page-container">

  <div class="content" id="latest">

    {{ content }}

  </div>

</main>


<footer class="footer">

  <div class="footer-inner">

    <span>
      内容导航中心 · 持续整理与更新
    </span>

    <span>
      <a href="/">首页</a>
      ·
      <a href="/articles/">全部文章</a>
    </span>

  </div>

</footer>

</body>
</html>
